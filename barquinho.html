<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barquinho</title>

<style>

body{
    margin:0;
    overflow:hidden;
}

.ceu{
    height:70vh;
    background:
    linear-gradient(
        skyblue,
        white
    );
    position:relative;
}

.mar{
    height:30vh;
    background:#0077be;
    position:relative;
}

.mar::before{
    content:"";
    position:absolute;
    width:100%;
    height:30px;
    background:
    radial-gradient(circle,
    white 10%,
    transparent 11%);
}

.nuvem{
    width:120px;
    height:50px;
    background:white;
    border-radius:50px;
    position:absolute;
    top:50px;
    animation:nuvem 20s linear infinite;
}

.nuvem::before{
    content:"";
    width:60px;
    height:60px;
    background:white;
    border-radius:50%;
    position:absolute;
    left:20px;
    top:-20px;
}

.barco{
    width:120px;
    height:40px;
    background:brown;
    border-radius:0 0 30px 30px;
    position:absolute;
    bottom:100px;
    left:-150px;
    animation:
        navegar 15s linear infinite,
        balanco 2s infinite;
    z-index:5;
}

@keyframes navegar{
    from{
        left:-150px;
    }
    to{
        left:100%;
    }
}

@keyframes balanco{
    0%{
        transform:rotate(-3deg);
    }

    50%{
        transform:rotate(3deg);
    }

    100%{
        transform:rotate(-3deg);
    }
}

@keyframes nuvem{
    from{
        left:-150px;
    }
    to{
        left:100%;
    }
}

</style>

</head>
<body>

<div class="ceu">

<div class="nuvem"></div>

<div class="barco"></div>

</div>

<div class="mar"></div>

</body>
</html>
