<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contato</title>
</head>
<body>

<h1>Contato</h1>

<p>Preencha os campos abaixo para entrar em contato.</p>

<a href="curriculo.html">Voltar ao Currículo</a>

<form>

<label for="nome">Nome:</label><br>
<input type="text" id="nome" required placeholder="Digite seu nome">
<br><br>

<label for="email">E-mail:</label><br>
<input type="email" id="email" required placeholder="Digite seu e-mail">
<br><br>

<label for="assunto">Assunto:</label><br>
<input type="text" id="assunto" placeholder="Assunto">
<br><br>

<label for="estado">Estado:</label><br>
<select id="estado">

<option>Santa Catarina</option>
<option>Paraná</option>
<option>São Paulo</option>
<option>Rio Grande do Sul</option>

</select>

<br><br>

<label for="mensagem">Mensagem:</label><br>
<textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>

<br><br>

<input type="submit" value="Enviar">

</form>

</body>
</html>
