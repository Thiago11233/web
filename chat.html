<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat</title>

<style>

body{
    background:#f1f1f1;
    font-family:Arial;
}

.chat{
    width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

.eu{
    float:right;
    clear:both;
    background:#c9ffc9;
    padding:10px;
    margin:10px;
    border-radius:15px;
}

.outro{
    float:left;
    clear:both;
    background:#ddd;
    padding:10px;
    margin:10px;
    border-radius:15px;
}

</style>

</head>
<body>

<div class="chat">

<div class="outro">
Olá!
</div>

<div class="eu">
Oi, tudo bem?
</div>

<div class="outro">
Tudo certo.
</div>

<div class="eu">
Vamos estudar CSS.
</div>

</div>

</body>
</html>
